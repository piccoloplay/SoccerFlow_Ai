default_settings:
  trainer_type: ppo

  hyperparameters:
    batch_size: 64
    buffer_size: 2048
    learning_rate: 3.0e-4
    beta: 5.0e-3
    epsilon: 0.2
    lambd: 0.95
    num_epoch: 3
    learning_rate_schedule: linear
    beta_schedule: linear
    epsilon_schedule: linear

  network_settings:
    normalize: false
    hidden_units: 128
    num_layers: 2
    vis_encode_type: simple

  reward_signals:
    extrinsic:
      gamma: 0.99
      strength: 1.0

  keep_checkpoints: 10
  checkpoint_interval: 10000
  max_steps: 300000
  time_horizon: 64
  summary_freq: 2000
  threaded: true

